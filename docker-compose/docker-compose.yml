name: codezero

services:
  config-generator:
    image: ${IMAGE_REGISTRY}/config-generator:${IMAGE_TAG}
    env_file:
      - .env
    volumes:
      - generated-configs:/generated-configs
    restart: "no"
    profiles:
      - ide
      - runtime

  postgres:
    image: postgres:18.3
    environment:
      - POSTGRES_DB=${POSTGRES_DB}
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    profiles:
      - ide

  sagittarius-rails-web:
    image: ${IMAGE_REGISTRY}/sagittarius:${IMAGE_TAG}-${IMAGE_EDITION}
    depends_on:
      config-generator:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    environment:
      INITIAL_ROOT_PASSWORD: ${INITIAL_ROOT_PASSWORD}
      INITIAL_ROOT_MAIL: ${INITIAL_ROOT_MAIL}
      INITIAL_RUNTIME_TOKEN: ${INITIAL_RUNTIME_TOKEN}
      SAGITTARIUS_CONFIG_FILES: /tmp/generated-configs/sagittarius.sagittarius.yml,/tmp/generated-configs/sagittarius.sagittarius-web.yml
    volumes:
      - generated-configs:/tmp/generated-configs:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl --fail http://localhost:3000/health/liveness"]
      interval: 10s
      timeout: 5s
      retries: 5
    profiles:
      - ide

  sagittarius-rails-background:
    image: ${IMAGE_REGISTRY}/sagittarius:${IMAGE_TAG}-${IMAGE_EDITION}
    depends_on:
      sagittarius-rails-web:
        condition: service_healthy
    volumes:
      - generated-configs:/tmp/generated-configs:ro
    environment:
      SAGITTARIUS_CONFIG_FILES: /tmp/generated-configs/sagittarius.sagittarius.yml,/tmp/generated-configs/sagittarius.sagittarius-background.yml
    command:
      - bundle
      - exec
      - good_job
    restart: unless-stopped
    profiles:
      - ide

  sagittarius-grpc:
    image: ${IMAGE_REGISTRY}/sagittarius:${IMAGE_TAG}-${IMAGE_EDITION}
    depends_on:
      sagittarius-rails-web:
        condition: service_healthy
    volumes:
      - generated-configs:/tmp/generated-configs:ro
    environment:
      SAGITTARIUS_CONFIG_FILES: /tmp/generated-configs/sagittarius.sagittarius.yml,/tmp/generated-configs/sagittarius.sagittarius-grpc.yml
    command:
      - bin/grpc_server
    restart: unless-stopped
    profiles:
      - ide

  sagittarius-gateway:
    image: ${IMAGE_REGISTRY}/sagittarius-gateway:${IMAGE_TAG}
    depends_on:
      sagittarius-grpc:
        condition: service_started
    volumes:
      - generated-configs:/tmp/generated-configs:ro
    environment:
      GATEWAY_CONFIG_PATH: /tmp/generated-configs/sagittarius-gateway.gateway.yml
    restart: unless-stopped
    profiles:
      - ide

  sagittarius-rails-cable:
    image: ${IMAGE_REGISTRY}/sagittarius:${IMAGE_TAG}-${IMAGE_EDITION}
    depends_on:
      sagittarius-rails-web:
        condition: service_healthy
    volumes:
      - generated-configs:/tmp/generated-configs:ro
    environment:
      SAGITTARIUS_CONFIG_FILES: /tmp/generated-configs/sagittarius.sagittarius.yml,/tmp/generated-configs/sagittarius.sagittarius-cable.yml
    command:
      - bundle
      - exec
      - puma
      - config.cable.ru
    restart: unless-stopped
    profiles:
      - ide

  sculptor:
    image: ${IMAGE_REGISTRY}/sculptor:${IMAGE_TAG}-${IMAGE_EDITION}
    restart: unless-stopped
    environment:
      OPENTELEMETRY_ENABLED: ${OPENTELEMETRY_ENABLED:-false}
      OTEL_SERVICE_NAME: ${OPENTELEMETRY_SERVICE_NAME_SCULPTOR}
      OTEL_LOGS_ENDPOINT: ${OPENTELEMETRY_LOGS_HTTP_ENDPOINT}
      OTEL_METRICS_ENDPOINT: ${OPENTELEMETRY_METRICS_HTTP_ENDPOINT}
      OTEL_TRACES_ENDPOINT: ${OPENTELEMETRY_TRACES_HTTP_ENDPOINT}
      NEXT_PUBLIC_OTEL_SERVICE_NAME: ${OPENTELEMETRY_SERVICE_NAME_SCULPTOR_CLIENTSIDE}
      NEXT_PUBLIC_OTEL_LOGS_ENDPOINT: ${OPENTELEMETRY_LOGS_CLIENTSIDE_HTTP_ENDPOINT}
      NEXT_PUBLIC_OTEL_METRICS_ENDPOINT: ${OPENTELEMETRY_METRICS_CLIENTSIDE_HTTP_ENDPOINT}
      NEXT_PUBLIC_OTEL_TRACES_ENDPOINT: ${OPENTELEMETRY_TRACES_CLIENTSIDE_HTTP_ENDPOINT}
    entrypoint: |
      sh -c "
        if [ \"$$OPENTELEMETRY_ENABLED\" != 'true' ]; then
          echo 'UNSET OTEL'
          unset OTEL_SERVICE_NAME OTEL_LOGS_ENDPOINT OTEL_METRICS_ENDPOINT OTEL_TRACES_ENDPOINT
          unset NEXT_PUBLIC_OTEL_SERVICE_NAME NEXT_PUBLIC_OTEL_LOGS_ENDPOINT NEXT_PUBLIC_OTEL_METRICS_ENDPOINT NEXT_PUBLIC_OTEL_TRACES_ENDPOINT
        fi
        exec npm run start
      "
    profiles:
      - ide

  velorum:
    image: ${IMAGE_REGISTRY}/velorum:${IMAGE_TAG}-${IMAGE_EDITION}
    depends_on:
      config-generator:
        condition: service_completed_successfully
    restart: unless-stopped
    environment:
      SECURITY_TOKEN: ${VELORUM_JWT_SECRET}
    volumes:
      - generated-configs:/tmp/generated-configs:ro
      - ./velorum.few_shots_external.configuration.json:/velorum/few_shots_external.configuration.json:ro
    entrypoint: |
      sh -c "
        cp /tmp/generated-configs/velorum.models.configuration.json models.configuration.json
        exec uv run main.py
      "
    profiles:
      - ide_velorum

  nginx:
    image: nginx:1.31.3-alpine-otel
    depends_on:
      config-generator:
        condition: service_completed_successfully
      sagittarius-rails-web:
        condition: service_started
      sagittarius-rails-cable:
        condition: service_started
      sagittarius-gateway:
        condition: service_started
      sculptor:
        condition: service_started
    volumes:
      - generated-configs:/tmp/generated-configs:ro
      - ./certs:/etc/nginx/certs:ro
    entrypoint: |
      sh -c "
        cp /tmp/generated-configs/nginx.default.conf /etc/nginx/conf.d/default.conf
        if [ -s /tmp/generated-configs/nginx.otel.conf ]; then
          sed -i '1i load_module modules/ngx_otel_module.so;' /etc/nginx/nginx.conf
          cp /tmp/generated-configs/nginx.otel.conf /etc/nginx/conf.d/otel.conf
        fi
        nginx -t
        exec nginx -g 'daemon off;'
      "
    ports:
      - "${HTTP_PORT}:80"
      - "${HTTPS_PORT}:443"
    restart: unless-stopped
    profiles:
      - ide

  nats:
    image: nats:2.14.4
    command:
      - -js
    restart: unless-stopped
    profiles:
      - runtime

  aquila:
    depends_on:
      config-generator:
        condition: service_completed_successfully
      nats:
        condition: service_started
    image: ${IMAGE_REGISTRY}/aquila:${IMAGE_TAG}
    environment:
      AQUILA_CONFIG_PATH: /tmp/generated-configs/aquila.aquila.yml
      AQUILA_SERVICE_CONFIG_PATH: /tmp/generated-configs/aquila.service.configuration.json
    volumes:
      - generated-configs:/tmp/generated-configs:ro
    restart: unless-stopped
    profiles:
      - runtime
    networks:
      - default
      - aquila

  taurus:
    depends_on:
      - nats
      - aquila
    image: ${IMAGE_REGISTRY}/taurus:${IMAGE_TAG}
    environment:
      MODE: dynamic
      AQUILA_URL: 'http://aquila:8081'
      NATS_URL: nats://nats:4222
      AQUILA_TOKEN: "${TAURUS_AQUILA_TOKEN}"
      AQUILA_GRPC_CONNECT_TIMEOUT_SECS: "${AQUILA_GRPC_CONNECT_TIMEOUT_SECS}"
      AQUILA_GRPC_REQUEST_TIMEOUT_SECS: "${AQUILA_GRPC_REQUEST_TIMEOUT_SECS}"
    restart: unless-stopped
    profiles:
      - runtime

  rest-action:
    depends_on:
      - aquila
    image: ${ACTION_IMAGE_REGISTRY}/rest-action:${ACTION_IMAGE_TAG}
    environment:
      HERCULES_AQUILA_URL: 'http://aquila:8081'
      HERCULES_AUTH_TOKEN: "${AQUILA_ACTION_REST_TOKEN}"
      HTTP_SERVER_PORT: 8084
      HTTP_SERVER_HOST: "0.0.0.0"
    ports:
      - "${REST_ACTION_PORT}:8084"
    restart: unless-stopped
    profiles:
      - runtime

  cron-action:
    depends_on:
      - aquila
    image: ${ACTION_IMAGE_REGISTRY}/cron-action:${ACTION_IMAGE_TAG}
    environment:
      HERCULES_AQUILA_URL: 'http://aquila:8081'
      HERCULES_AUTH_TOKEN: "${AQUILA_ACTION_CRON_TOKEN}"
    restart: unless-stopped
    profiles:
      - runtime

volumes:
  generated-configs:
  postgres-data:

networks:
  aquila:
    name: codezero-aquila
